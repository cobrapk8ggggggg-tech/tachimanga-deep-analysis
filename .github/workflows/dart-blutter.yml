name: "🧠 Blutter — Dart AOT Code Reconstruction (iOS)"

# Blutter الأصلي لا يقرأ Mach-O (iOS) — يستخدم tools/macho_to_elf_snapshots.py
# لتحويل ثنائي App إلى ELF اصطناعي يحمل رموز snapshots الأربعة، ثم
# tools/run_blutter_ios.py يستدعي Blutter بنسخة Dart ios/arm64 المطابقة.
# الناتج: إعادة بناء كل الكلاسات والدوال من Dart AOT + assembly.

on:
  workflow_dispatch:
    inputs:
      gdrive_file_id:
        description: "Google Drive file ID"
        required: false
        default: ""

env:
  DEFAULT_GDRIVE_ID: "1ah8FTj4MyMLNNmJDTj1wJkJjbJy7M5gJ"

jobs:
  blutter:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build build-essential cmake pkg-config python3-pip unzip zip git curl libcapstone-dev
          pip install --quiet gdown requests pyelftools
          echo "DEPS READY"

      - name: Download IPA
        run: |
          FILE_ID="${{ github.event.inputs.gdrive_file_id || env.DEFAULT_GDRIVE_ID }}"
          gdown "$FILE_ID" -O app.zip
          unzip -o -q app.zip -d download
          rm -rf download/__MACOSX
          IPA=$(find download -name "*.ipa" -not -name "._*" | head -1)
          test -n "$IPA" || { echo "IPA not found"; exit 1; }
          unzip -o -q "$IPA" -d ipa
          APP=$(find ipa/Payload -maxdepth 1 -name "*.app" -not -name "._*" | head -1)
          echo "APP_BIN=$APP/Frameworks/App.framework/App" >> $GITHUB_ENV
          echo "FLUTTER_BIN=$APP/Frameworks/Flutter.framework/Flutter" >> $GITHUB_ENV
          ls -la "$APP/Frameworks/App.framework"

      - name: Convert Mach-O → synthetic ELF + detect Dart version
        run: |
          python3 tools/macho_to_elf_snapshots.py "$APP_BIN" /tmp/libapp.so | tee dart_info.txt
          HASH=$(grep -oE "SNAPSHOT_HASH=[0-9a-f]{32}" dart_info.txt | cut -d= -f2)
          DART_VER=$(strings -a "$FLUTTER_BIN" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+ \((stable|beta|dev)\)" | head -1 | grep -oE "^[0-9]+\.[0-9]+\.[0-9]+")
          echo "DART_VERSION=$DART_VER" >> $GITHUB_ENV
          echo "SNAPSHOT_HASH=$HASH" >> $GITHUB_ENV
          echo "Detected: Dart $DART_VER | hash $HASH"

      - name: Clone Blutter
        run: |
          git clone https://github.com/worawit/blutter.git /tmp/blutter
          cd /tmp/blutter && git log -1 --oneline

      - name: Run Blutter (build Dart SDK 3.6.x ios/arm64 + analyze)
        run: |
          export DART_VERSION="$DART_VERSION"
          export DART_OS=ios
          export DART_ARCH=arm64
          export SNAPSHOT_HASH="$SNAPSHOT_HASH"
          export BLUTTER_DIR=/tmp/blutter
          python3 tools/run_blutter_ios.py /tmp/libapp.so /tmp/blutter_out 2>&1 | tee /tmp/blutter_run.log
          echo "==== OUTPUT ===="
          ls -la /tmp/blutter_out || true

      - name: Summarize results
        if: always()
        run: |
          mkdir -p data/blutter
          if [ -f /tmp/blutter_out/pp.txt ]; then
            cp /tmp/blutter_out/pp.txt data/blutter/pp_full.txt
            grep -n "class " data/blutter/pp_full.txt | head -2000 > data/blutter/classes_index.txt || true
            wc -l data/blutter/classes_index.txt || true
          fi
          if [ -f /tmp/blutter_out/strings.txt ]; then
            cp /tmp/blutter_out/strings.txt data/blutter/strings.txt
          fi
          cp dart_info.txt data/blutter/ 2>/dev/null || true
          cp /tmp/blutter_run.log data/blutter/ 2>/dev/null || true
          touch data/blutter/.keep
          ls -la data/blutter/

      - name: Commit summary
        run: |
          git config user.name "blutter-bot"
          git config user.email "action@github.com"
          git add data/blutter/
          git commit -m "Blutter Dart reconstruction (iOS Mach-O bridge) $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || true

      - name: Upload full Blutter output (asm + pp)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blutter-full-output
          path: /tmp/blutter_out/
          retention-days: 90
          compression-level: 9

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blutter-failure-log
          path: /tmp/blutter_run.log
          retention-days: 30
