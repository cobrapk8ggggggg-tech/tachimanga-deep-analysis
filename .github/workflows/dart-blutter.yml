name: "🧠 Blutter — Dart AOT Code Reconstruction"

# بناء Blutter (أقوى أداة لتفكيك تطبيقات Flutter) وإعادة بناء هيكل كود Dart
# الناتج: كل الكلاسات والدوال بحججها من AOT snapshot + assembly

on:
  workflow_dispatch:
    inputs:
      gdrive_file_id:
        description: "Google Drive file ID"
        required: false
        default: ""

env:
  DEFAULT_GDRIVE_ID: "1ah8FTj4MyMLNNmJDTj1wJkJjbJy7M5gJ"

jobs:
  blutter:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build build-essential cmake pkg-config python3-pip unzip zip git curl
          pip install --quiet gdown requests
          # كابستون محرك التفكيك
          git clone --depth 1 https://github.com/capstone-engine/capstone.git /tmp/capstone || true
          echo "DEPS READY"

      - name: Download IPA
        run: |
          FILE_ID="${{ github.event.inputs.gdrive_file_id || env.DEFAULT_GDRIVE_ID }}"
          gdown "$FILE_ID" -O app.zip
          unzip -o -q app.zip -d download
          IPA=$(find download -name "*.ipa" | head -1)
          unzip -o -q "$IPA" -d ipa
          APP=$(find ipa/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "APP_DIR=$APP/Frameworks/App.framework" >> $GITHUB_ENV
          ls -la "$APP/Frameworks/App.framework"

      - name: Clone Blutter
        run: |
          git clone https://github.com/worawit/blutter.git /tmp/blutter
          cd /tmp/blutter
          # تثبيت متطلبات بايثون إن وجدت
          pip install --quiet requests || true

      - name: Run Blutter (auto-detect Dart version)
        run: |
          mkdir -p /tmp/blutter_out
          cd /tmp/blutter
          # blutter يكتشف نسخة Dart من الـ snapshot ويحمّل SDK المطابق تلقائياً
          python3 blutter.py "$APP_DIR" /tmp/blutter_out 2>&1 | tee blutter_log.txt
          echo "==== OUTPUT ===="
          ls -la /tmp/blutter_out

      - name: Summarize results
        run: |
          mkdir -p blutter_summary
          # pp.txt = كل الكلاسات والدوال المعاد بناؤها
          if [ -f /tmp/blutter_out/pp.txt ]; then
            cp /tmp/blutter_out/pp.txt blutter_summary/pp_full.txt
            # كلاسات التطبيق فقط
            grep -n "class " blutter_summary/pp_full.txt | head -1000 > blutter_summary/classes_index.txt || true
            wc -l blutter_summary/classes_index.txt
          fi
          if [ -f /tmp/blutter_out/strings.txt ]; then
            cp /tmp/blutter_out/strings.txt blutter_summary/strings.txt
          fi
          cp /tmp/blutter/blutter_log.txt blutter_summary/ 2>/dev/null || true
          ls -la blutter_summary/

      - name: Commit summary
        run: |
          git config user.name "blutter-bot"
          git config user.email "action@github.com"
          git add blutter_summary/ || true
          git commit -m "Blutter Dart reconstruction $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || true

      - name: Upload full Blutter output (asm + pp)
        uses: actions/upload-artifact@v4
        with:
          name: blutter-full-output
          path: /tmp/blutter_out/
          retention-days: 90
          compression-level: 9

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blutter-failure-log
          path: blutter_log.txt
          retention-days: 30
