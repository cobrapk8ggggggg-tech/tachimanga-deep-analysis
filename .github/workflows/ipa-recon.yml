name: "🔨 IPA Deep Recon"

# استطلاع شامل للـ IPA: تفريغ كامل للسلاسل النصية، الرموز، الفحص المعماري
# يتطلب: repo variable GDRIVE_FILE_ID (افتراضي: ملف Tachimanga)

on:
  workflow_dispatch:
    inputs:
      gdrive_file_id:
        description: "Google Drive file ID (يتجاهل المتغير المخزن)"
        required: false
        default: ""
  repository_dispatch:
    types: [run-recon]

env:
  DEFAULT_GDRIVE_ID: "1ah8FTj4MyMLNNmJDTj1wJkJjbJy7M5gJ"

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq tree binutils file unzip zip python3-pip
          pip install --quiet gdown
          echo "TOOLS READY"

      - name: Download IPA from Google Drive
        run: |
          FILE_ID="${{ github.event.inputs.gdrive_file_id || env.DEFAULT_GDRIVE_ID }}"
          gdown "$FILE_ID" -O app.zip
          ls -la app.zip
          unzip -o -q app.zip -d download
          rm -rf download/__MACOSX
          IPA=$(find download -name "*.ipa" -not -name "._*" | head -1)
          test -n "$IPA" || { echo "IPA not found"; exit 1; }
          echo "IPA_PATH=$IPA" >> $GITHUB_ENV
          unzip -o -q "$IPA" -d ipa
          echo "Extracted:"
          tree -L 2 ipa/Payload | head -40

      - name: Full strings dump (Dart AOT + native)
        run: |
          APP=$(find ipa/Payload -name "*.app" -maxdepth 1 | head -1)
          mkdir -p data/recon/strings data/recon/plist data/recon/jre
          # Dart AOT snapshot — أهم ملف
          strings -a "$APP/Frameworks/App.framework/App" > data/recon/strings/dart_aot_full.txt
          # كل المكتبات
          for fw in "$APP"/Frameworks/*.framework/* "$APP"/*.dylib "$APP/Frameworks"/*.dylib "$APP/Tachimanga"; do
            [ -f "$fw" ] && strings -a "$fw" > "data/recon/strings/$(basename $fw).strings.txt" || true
          done
          # أسماء حزم Dart
          grep -oE "package:[a-zA-Z_0-9]+/" data/recon/strings/dart_aot_full.txt | sort -u > data/recon/strings/dart_packages.txt
          # ملفات تطبيق Dart
          grep -oE "package:tachidesk_sorayomi/[a-zA-Z_0-9/]+\.dart" data/recon/strings/dart_aot_full.txt | sort -u > data/recon/strings/app_dart_files.txt || true
          # جميع URIs الأخرى
          grep -oE "(https?|ws)://[a-zA-Z0-9./_:?=&%-]+" data/recon/strings/dart_aot_full.txt | sort -u | head -3000 > data/recon/strings/all_urls.txt
          wc -l data/recon/strings/*.txt

      - name: Mach-O inspection
        run: |
          APP=$(find ipa/Payload -name "*.app" -maxdepth 1 | head -1)
          {
            echo "## Mach-O binaries in $(basename $APP)"
            for f in "$APP/Tachimanga" "$APP"/Frameworks/*.framework/* "$APP"/Frameworks/*.dylib; do
              [ -f "$f" ] && file "$f"
            done
          } > data/recon/macho_report.txt
          # Info.plist full dump
          plutil -convert json -o data/recon/plist/info.json "$APP/Info.plist" 2>/dev/null || true
          # كل الإطارات مع الأحجام
          du -sh "$APP/Frameworks/"*.framework "$APP/Frameworks/"*.dylib | sort -rh > data/recon/frameworks_sizes.txt
          cat data/recon/macho_report.txt

      - name: JVM modules analysis
        run: |
          APP=$(find ipa/Payload -name "*.app" -maxdepth 1 | head -1)
          cp -r "$APP/jre/lib/java.properties" data/recon/jre/ 2>/dev/null || true
          jimage=$(which jimage || true)
          if [ -n "$jimage" ]; then
            jimage list "$APP/jre/lib/modules" > data/recon/jre/jvm_modules_list.txt 2>/dev/null || true
            wc -l data/recon/jre/jvm_modules_list.txt
          else
            echo "jimage not found - install JDK" > data/recon/jre/jvm_modules_list.txt
            sudo apt-get install -y -qq openjdk-21-jdk-headless
            jimage list "$APP/jre/lib/modules" > data/recon/jre/jvm_modules_list.txt 2>/dev/null || true
            wc -l data/recon/jre/jvm_modules_list.txt
          fi
          # classes تخص suwayomi/kanade داخل الـ modules
          grep -iE "(suwayomi|kanade|tachidesk|tachiyomi|github/null2264)" data/recon/jre/jvm_modules_list.txt | head -200 > data/recon/jre/suwayomi_classes.txt || true
          wc -l data/recon/jre/suwayomi_classes.txt

      - name: Commit recon results
        run: |
          git config user.name "recon-bot"
          git config user.email "action@github.com"
          git add data/recon/
          git commit -m "IPA recon results $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push

      - name: Upload full strings as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-recon-full
          path: recon/
          retention-days: 90
