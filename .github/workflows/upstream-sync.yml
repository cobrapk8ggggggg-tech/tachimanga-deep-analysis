name: "🔄 Upstream Sorayomi Watch"

# مراقبة أسبوعية لمستودع Sorayomi الأصلي — يفتح Issue عند وجود تحديثات
on:
  schedule:
    - cron: "0 6 * * 1"  # كل اثنين 6 صباحاً UTC
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM="Suwayomi/Tachidesk-Sorayomi"
          LAST_FILE=".upstream_last_commit"
          LAST=$(cat "$LAST_FILE" 2>/dev/null || echo "")
          LATEST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$UPSTREAM/commits?per_page=1" | jq -r '.[0].sha')
          LATEST_MSG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$UPSTREAM/commits/$LATEST" | jq -r '.commit.message' | head -1)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "msg=$LATEST_MSG" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$LAST" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "$LATEST" > "$LAST_FILE"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue on upstream change
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔔 تحديث upstream في Sorayomi: ${{ steps.check.outputs.msg }}`,
              body: `يوجد commits جديدة في [Suwayomi/Tachidesk-Sorayomi](https://github.com/Suwayomi/Tachidesk-Sorayomi/commits/main)
              
              آخر commit: \`${{ steps.check.outputs.latest }}\`
              
              **الإجراء المقترح:** اعمل سحب للتحديثات في fork خاصتك:
              \`\`\`bash
              cd my-manga
              git remote add upstream https://github.com/Suwayomi/Tachidesk-Sorayomi.git 2>/dev/null || true
              git fetch upstream
              git merge upstream/main
              \`\`\``,
              labels: ["upstream-sync"]
            })

      - name: Save state
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "upstream-bot"
          git config user.email "action@github.com"
          git add .upstream_last_commit
          git commit -m "chore: update upstream pointer"
          git push
